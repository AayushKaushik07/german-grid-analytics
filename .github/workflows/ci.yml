name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, test and build dbt models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: grid_ci
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: grid_ci
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      # lets scripts/seed_ci_data.py import the ingestion package
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest -q

      - name: Seed CI fixtures
        # A small deterministic slice of data so dbt has something to build
        # against without calling the live APIs from CI.
        run: python scripts/seed_ci_data.py

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt build (models + tests)
        working-directory: dbt
        run: dbt build --fail-fast
