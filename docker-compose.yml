services:
  postgres:
    image: postgres:16-alpine
    container_name: grid_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposed so Power BI Desktop on the host can connect to localhost:5432.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    container_name: grid_pipeline
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dbt:/app/dbt
    # Overridden on the command line, e.g.
    #   docker compose run --rm pipeline python -m ingestion.run_ingest --start ...
    command: ["python", "-m", "ingestion.run_ingest"]

volumes:
  pgdata:
